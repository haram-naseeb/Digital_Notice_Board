<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <head>
  <link rel="icon" type="image/png" href="uet_cs_logo.jpg">
  <title>Login — UET CS Notice Board</title>
  </head> 
  <meta name="description" content="Login to the UET Department of Computer Science Digital Notice Board management portal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary:       #1e3a8a;
      --primary-mid:   #2563eb;
      --primary-light: #3b82f6;
      --primary-pale:  #eff6ff;
      --text:          #0f172a;
      --text-muted:    #64748b;
      --border:        #e2e8f0;
      --danger:        #dc2626;
      --danger-pale:   #fee2e2;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #2563eb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.08) 1px, transparent 0);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    /* UET header above card */
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logos {
      display: flex;
      justify-content: center;
      gap: 20px;
      align-items: center;
      margin-bottom: 16px;
    }

    .login-logo-wrap {
      width: 72px;
      height: 72px;
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .login-logo-wrap img {
      max-width: 60px;
      max-height: 60px;
      object-fit: contain;
    }

    .login-header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.4px;
      margin-bottom: 4px;
    }

    .login-header p {
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      font-weight: 400;
    }

    /* Card */
    .login-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25), 0 8px 20px rgba(0,0,0,0.15);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      display: flex;
      align-items: center;
    }

    .input-icon svg {
      width: 16px;
      height: 16px;
    }

    .form-group input {
      width: 100%;
      height: 44px;
      padding: 0 40px 0 40px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: #f8fafc;
      transition: all 0.18s ease;
      outline: none;
      box-sizing: border-box;
    }

    .form-group input:focus {
      border-color: var(--primary-light);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    .toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.15s ease;
    }

    .toggle-btn:hover { color: #475569; }
    .toggle-btn svg { width: 16px; height: 16px; }

    .btn-login {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.2px;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
      transform: translateY(-1px);
    }

    .btn-login:active { transform: translateY(0); }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-box {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--danger-pale);
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 11px 14px;
      margin-top: 14px;
      font-size: 13px;
      color: var(--danger);
      font-weight: 500;
    }

    .error-box svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
    }

    .back-link a {
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      transition: color 0.15s ease;
      font-weight: 500;
    }

    .back-link a:hover { color: rgba(255,255,255,0.9); }

    /* Spinner inside button */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">

    <div class="login-header">
      <h1>Digital Notice Board</h1>
      <p>Department of Computer Science &mdash; UET, Lahore</p>
    </div>

    <div class="login-card">
      <div class="card-title">Sign In</div>
      <div class="card-subtitle">Enter your credentials to access the portal</div>

      <form id="login-form" onsubmit="handleLogin(event)" novalidate>

        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="toggle-btn" id="pw-toggle" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="login-btn">Sign In</button>

        <div class="error-box" id="error-box">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          <span id="error-text">Invalid username or password</span>
        </div>

      </form>
    </div>

    <div class="back-link">
      <a href="home.html">← Back to Home</a>
    </div>

  </div>

  <script src="config.js"></script>
  <script>
    const API = (window.NOTICE_BOARD_API_URL || (['localhost', '127.0.0.1'].includes(location.hostname) ? 'http://localhost:3000' : '')).replace(/\/$/, '');

    async function handleLogin(event) {
      event.preventDefault();
      const errorBox  = document.getElementById('error-box');
      const errorText = document.getElementById('error-text');
      const btn       = document.getElementById('login-btn');

      errorBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errorText.textContent = 'Please enter both username and password.';
        errorBox.style.display = 'flex';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in...';

      try {
        const res = await fetch(`${API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('nb_user', JSON.stringify({
            username: data.username,
            role: data.role,
            token: data.token
          }));
          window.location.href = 'index.html';
        } else {
          errorText.textContent = data.message || 'Invalid username or password.';
          errorBox.style.display = 'flex';
          btn.disabled = false;
          btn.innerHTML = 'Sign In';
        }
      } catch (err) {
        console.error('Login error:', err);
        errorText.textContent = 'Connection error. Please make sure the server is running.';
        errorBox.style.display = 'flex';
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        `;
      } else {
        input.type = 'password';
        icon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        `;
      }
    }
  </script>

</body>
</html>
