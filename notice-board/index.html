<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <head>
  <link rel="icon" type="image/png" href="uet_cs_logo.jpg">
    <title>Dashboard — UET CS Notice Board</title>
  </head> 
  <meta name="description" content="UET CS Department Digital Notice Board - Admin Dashboard">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Dashboard</h1>
        <p class="subtitle">Overview of department activity</p>
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
        </div>
        <div class="stat-card-value" id="total-announcements">—</div>
        <div class="stat-card-label">Total Announcements</div>
      </div>
      <div class="stat-card stat-orange">
        <div class="stat-card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div class="stat-card-value" id="pending-count">—</div>
        <div class="stat-card-label">Pending Approval</div>
      </div>
      <div class="stat-card stat-green">
        <div class="stat-card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        </div>
        <div class="stat-card-value" id="sessions-count">—</div>
        <div class="stat-card-label">Active Sessions</div>
      </div>
      <div class="stat-card stat-purple">
        <div class="stat-card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="stat-card-value" id="rooms-count">—</div>
        <div class="stat-card-label">Total Rooms</div>
      </div>
    </div>

    <!-- Recent Announcements -->
    <div class="card">
      <div class="card-header">
        <h2>
          <i data-lucide="megaphone"></i>
          Recent Announcements
        </h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Status</th>
              <th>Created</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="recent-list">
            <tr><td colspan="5" class="empty-row">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    checkAuth();

    const API = 'http://localhost:3000';
    const user = getCurrentUser();
    const isChairman = user && user.role === 'chairman';
    const isAdmin    = user && user.role === 'admin';

    renderSidebar('index.html');

    const CATEGORY_BADGE = {
      general: 'badge-blue',
      urgent:  'badge-red',
      event:   'badge-purple',
    };
    const STATUS_BADGE = {
      pending:  'badge-amber',
      approved: 'badge-green',
    };

    async function loadDashboard() {
      try {
        const [ann, sess, rooms] = await Promise.all([
          fetch(`${API}/announcements`).then(r => r.json()),
          fetch(`${API}/sessions`).then(r => r.json()),
          fetch(`${API}/rooms`).then(r => r.json()),
        ]);

        document.getElementById('total-announcements').textContent = ann.length;
        document.getElementById('pending-count').textContent = ann.filter(a => a.status === 'pending').length;
        document.getElementById('sessions-count').textContent = sess.length;
        document.getElementById('rooms-count').textContent = rooms.length;

        const tbody = document.getElementById('recent-list');
        tbody.innerHTML = '';

        if (ann.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty-row">No announcements yet</td></tr>';
          return;
        }

        ann.slice(0, 10).forEach(a => {
          const catClass = CATEGORY_BADGE[a.category] || 'badge-gray';
          const stClass  = STATUS_BADGE[a.status]     || 'badge-gray';

          // Chairman can approve pending; Admin can see status only in dashboard
          let actionHtml = '<span class="text-muted text-sm">—</span>';
          if (a.status === 'pending' && isChairman) {
            actionHtml = `<button class="btn btn-success" onclick="approve(${a.announcement_id})">Approve</button>`;
          } else if (a.status === 'approved') {
            actionHtml = `<span class="badge badge-green">Approved</span>`;
          } else if (a.status === 'pending' && isAdmin) {
            actionHtml = `<span class="badge badge-amber">Awaiting Approval</span>`;
          }

          tbody.innerHTML += `
            <tr>
              <td><span class="font-semibold">${a.title}</span></td>
              <td><span class="badge ${catClass}">${a.category}</span></td>
              <td><span class="badge ${stClass}">${a.status}</span></td>
              <td class="text-secondary text-sm">${new Date(a.created_at).toLocaleDateString()}</td>
              <td>${actionHtml}</td>
            </tr>`;
        });

        if (window.lucide) lucide.createIcons();
      } catch (err) {
        showToast('Failed to connect to server. Is it running?', 'error');
      }
    }

    async function approve(id) {
      try {
        const res  = await fetch(`${API}/announcements/approve/${id}`, { method: 'POST' });
        const data = await res.json();
        showToast(data.success ? 'Announcement approved and sent to display' : (data.message || 'Approval failed'), data.success ? 'success' : 'error');
        loadDashboard();
      } catch {
        showToast('Failed to approve announcement', 'error');
      }
    }

    loadDashboard();
  </script>

</body>
</html>
