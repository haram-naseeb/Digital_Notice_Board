<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notice Board - Teachers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sidebar">
    <h2>📋 Notice Board</h2>
    <a href="index.html">🏠 Dashboard</a>
    <a href="announcements.html">📢 Announcements</a>
    <a href="timetable.html">📅 Timetable</a>
    <a href="sessions.html">🎓 Sessions</a>
    <a href="sections.html">👥 Sections</a>
    <a href="subjects.html">📚 Subjects</a>
    <a href="rooms.html">🏫 Rooms</a>
    <a href="teachers.html" class="active">👨‍🏫 Teachers</a>
    <a href="offices.html">🏢 Teacher Offices</a>
  </div>

  <div class="main">
    <h1>Teachers</h1>
    <p class="subtitle">Manage teacher list</p>

    <div class="card">
      <h2>➕ Add New Teacher</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Teacher Name</label>
          <input type="text" id="teacher_name" placeholder="e.g. Dr. Ayesha Altaf" />
        </div>
      </div>
      <button class="btn btn-primary" onclick="addTeacher()">➕ Add Teacher</button>
    </div>

    <div class="card">
      <h2>👨‍🏫 All Teachers</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Teacher ID</th>
            <th>Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="teachers-list">
          <tr><td colspan="4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    window.onload = async () => {
      await loadTeachers();
    };

    async function loadTeachers() {
      try {
        const data  = await fetch('http://localhost:3000/teachers').then(r => r.json());
        const tbody = document.getElementById('teachers-list');
        tbody.innerHTML = '';

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#718096">No teachers yet</td></tr>';
          return;
        }

        data.forEach((t, i) => {
          tbody.innerHTML += `
            <tr>
              <td>${i + 1}</td>
              <td><strong>${t.teacher_id}</strong></td>
              <td>${t.teacher_name}</td>
              <td>
                <button class="btn btn-danger" onclick="deleteTeacher(${t.teacher_id})">🗑️ Delete</button>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        alert('Error loading teachers: ' + err.message);
      }
    }

    async function addTeacher() {
      const name = document.getElementById('teacher_name').value.trim();
      
      if (!name) {
        alert('Please enter teacher name');
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/teachers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ teacher_name: name })
        });
        const result = await res.json();
        
        if (res.ok) {
          alert('Teacher added successfully!');
          document.getElementById('teacher_name').value = '';
          await loadTeachers();
        } else {
          alert('Error: ' + (result.error || 'Failed to add teacher'));
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    async function deleteTeacher(teacherId) {
      if (!confirm('Are you sure you want to delete this teacher?')) return;

      try {
        const res = await fetch(`http://localhost:3000/teachers/${teacherId}`, {
          method: 'DELETE'
        });
        
        if (res.ok) {
          alert('Teacher deleted successfully!');
          await loadTeachers();
        } else {
          const result = await res.json();
          alert('Error: ' + (result.error || 'Failed to delete teacher'));
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  </script>

</body>
</html>
