<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <head>
  <link rel="icon" type="image/png" href="uet_cs_logo.jpg">
  <title>Teachers — UET CS Notice Board</title>
  </head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>

  <!-- ── Sidebar Container ──────────────────────────────── -->
  <div id="sidebar-container"></div>

  <main class="main">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Teachers</h1>
        <p class="subtitle">Manage the department faculty roster</p>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2><i data-lucide="plus-circle"></i> Add New Teacher</h2>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label for="teacher_name">Full Name</label>
          <input type="text" id="teacher_name" placeholder="e.g. Dr. Ayesha Altaf" />
        </div>
      </div>
      <button class="btn btn-primary" onclick="addTeacher()">
        <i data-lucide="plus"></i> Add Teacher
      </button>
    </div>

    <div class="card">
      <div class="card-header">
        <h2><i data-lucide="user-square"></i> All Teachers</h2>
        <span id="tch-count" class="badge badge-gray">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>ID</th>
              <th>Name</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="teachers-list">
            <tr><td colspan="4" class="empty-row">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    // Auth guard - admin only
    checkAuth('admin');
    renderSidebar('teachers.html');

    const API = 'http://localhost:3000';

    window.onload = loadTeachers;

    async function loadTeachers() {
      try {
        const data  = await fetch(`${API}/teachers`).then(r => r.json());
        const tbody = document.getElementById('teachers-list');
        document.getElementById('tch-count').textContent = `${data.length} teachers`;
        tbody.innerHTML = '';

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="empty-row">No teachers yet</td></tr>';
          return;
        }

        data.forEach((t, i) => {
          tbody.innerHTML += `
            <tr>
              <td class="text-muted text-sm">${i + 1}</td>
              <td class="text-muted text-sm">${t.teacher_id}</td>
              <td><span class="font-medium">${t.teacher_name}</span></td>
              <td>
                <button class="btn btn-danger" onclick="delTeacher(${t.teacher_id})">
                  <i data-lucide="trash-2"></i> Delete
                </button>
              </td>
            </tr>`;
        });
        if (window.lucide) lucide.createIcons();
      } catch (err) { showToast('Could not load teachers: ' + err.message, 'error'); }
    }

    async function addTeacher() {
      const name = document.getElementById('teacher_name').value.trim();
      if (!name) { showToast('Please enter a teacher name', 'warning'); return; }

      try {
        const res    = await fetch(`${API}/teachers`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ teacher_name: name })
        });
        const result = await res.json();
        if (res.ok) {
          showToast('Teacher added successfully', 'success');
          document.getElementById('teacher_name').value = '';
          loadTeachers();
        } else {
          showToast(result.error || 'Failed to add teacher', 'error');
        }
      } catch (err) { showToast('Error: ' + err.message, 'error'); }
    }

    function delTeacher(id) {
      showConfirm('This teacher will be permanently removed from the system.', async () => {
        try {
          const res = await fetch(`${API}/teachers/${id}`, { method: 'DELETE' });
          if (res.ok) {
            showToast('Teacher deleted successfully', 'success');
            loadTeachers();
          } else {
            const r = await res.json();
            showToast(r.error || 'Failed to delete teacher', 'error');
          }
        } catch (err) { showToast('Error: ' + err.message, 'error'); }
      }, 'Delete Teacher');
    }
  </script>

</body>
</html>
