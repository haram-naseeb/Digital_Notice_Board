<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <head>
  <link rel="icon" type="image/png" href="uet_cs_logo.jpg">
  <title>Announcements — UET CS Notice Board</title>
  </head>
  <meta name="description" content="Manage departmental announcements for the UET CS Digital Notice Board.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main">
    <div class="page-header">
      <div class="page-header-left">
        <h1 id="page-title">Announcements</h1>
        <p class="subtitle" id="page-subtitle">Add and manage department announcements</p>
      </div>
    </div>

    <!-- Add Form — Admin only -->
    <div class="card" id="add-form-card">
      <div class="card-header">
        <h2><i data-lucide="plus-circle"></i> New Announcement</h2>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="Announcement title">
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="general">General</option>
            <option value="urgent">Urgent</option>
            <option value="event">Event</option>
          </select>
        </div>
        <div class="form-group">
          <label for="start_datetime">Start Date &amp; Time</label>
          <input type="datetime-local" id="start_datetime">
        </div>
        <div class="form-group">
          <label for="end_datetime">End Date &amp; Time</label>
          <input type="datetime-local" id="end_datetime">
        </div>
        <div class="form-group span-2">
          <label for="message">Message</label>
          <textarea id="message" placeholder="Type announcement message here..."></textarea>
        </div>
      </div>
      <button class="btn btn-primary" id="submit-btn" onclick="addAnnouncement()">
        <i data-lucide="send"></i> Submit for Approval
      </button>
    </div>

    <!-- Chairman info banner -->
    <div class="role-banner" id="chairman-banner" style="display:none;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      As Chairman, you can review and approve pending announcements submitted by the admin.
    </div>

    <!-- Announcements Table -->
    <div class="card">
      <div class="card-header">
        <h2 id="table-title"><i data-lucide="list"></i> All Announcements</h2>
        <span id="ann-count" class="badge badge-gray">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Title</th>
              <th>Message</th>
              <th>Category</th>
              <th>Start</th>
              <th>End</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="announcements-list">
            <tr><td colspan="8" class="empty-row">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    checkAuth();
    renderSidebar('announcements.html');

    const API         = 'http://localhost:3000';
    const user        = getCurrentUser();
    const isChairman  = user && user.role === 'chairman';
    const isAdmin     = user && user.role === 'admin';

    const CATEGORY_BADGE = { general: 'badge-blue', urgent: 'badge-red', event: 'badge-purple' };
    const STATUS_BADGE   = { pending: 'badge-amber', approved: 'badge-green' };

    // Configure view per role
    if (isChairman) {
      document.getElementById('add-form-card').style.display   = 'none';
      document.getElementById('chairman-banner').style.display = 'flex';
      document.getElementById('page-title').textContent        = 'Pending Approvals';
      document.getElementById('page-subtitle').textContent     = 'Review and approve announcements submitted by admin';
      document.getElementById('table-title').innerHTML         = '<i data-lucide="clock"></i> Pending Announcements';
    }

    window.onload = () => {
      loadAnnouncements();
      setInterval(loadAnnouncements, 30000);
    };

    async function loadAnnouncements() {
      try {
        const res  = await fetch(`${API}/announcements`);
        const data = await res.json();
        const tbody = document.getElementById('announcements-list');
        tbody.innerHTML = '';

        // Chairman sees only pending; admin sees all
        const toShow = isChairman ? data.filter(a => a.status === 'pending') : data;

        document.getElementById('ann-count').textContent = `${toShow.length}`;

        if (toShow.length === 0) {
          const msg = isChairman ? 'No pending announcements' : 'No announcements yet';
          tbody.innerHTML = `<tr><td colspan="8" class="empty-row">${msg}</td></tr>`;
          return;
        }

        toShow.forEach((a, i) => {
          const catCls = CATEGORY_BADGE[a.category] || 'badge-gray';
          const stCls  = STATUS_BADGE[a.status]     || 'badge-gray';

          let actions = '';
          // Chairman can approve pending
          if (a.status === 'pending' && isChairman) {
            actions += `<button class="btn btn-success" onclick="approve(${a.announcement_id})">
              <i data-lucide="check"></i> Approve
            </button>`;
          }
          // Admin can delete any
          if (isAdmin) {
            actions += `<button class="btn btn-danger" onclick="del(${a.announcement_id})">
              <i data-lucide="trash-2"></i> Delete
            </button>`;
          }
          if (!actions) actions = '<span class="text-muted text-sm">—</span>';

          tbody.innerHTML += `
            <tr>
              <td class="text-muted text-sm">${i + 1}</td>
              <td><span class="font-semibold">${a.title}</span></td>
              <td class="text-secondary text-sm" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                ${a.message ? a.message.substring(0, 45) + (a.message.length > 45 ? '…' : '') : '—'}
              </td>
              <td><span class="badge ${catCls}">${a.category}</span></td>
              <td class="text-secondary text-sm">${fmt(a.start_datetime)}</td>
              <td class="text-secondary text-sm">${fmt(a.end_datetime)}</td>
              <td><span class="badge ${stCls}">${a.status}</span></td>
              <td>
                <div class="td-actions">${actions}</div>
              </td>
            </tr>`;
        });

        if (window.lucide) lucide.createIcons();
      } catch {
        showToast('Could not load announcements', 'error');
      }
    }

    async function addAnnouncement() {
      const title          = document.getElementById('title').value.trim();
      const message        = document.getElementById('message').value.trim();
      const category       = document.getElementById('category').value;
      const start_datetime = document.getElementById('start_datetime').value;
      const end_datetime   = document.getElementById('end_datetime').value;

      if (!title || !message || !start_datetime || !end_datetime) {
        showToast('Please fill in all fields', 'warning');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;

      try {
        const res  = await fetch(`${API}/announcements`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ title, message, category, start_datetime, end_datetime })
        });
        const data = await res.json();
        showToast(data.success ? 'Announcement submitted for approval' : (data.message || 'Failed to add'), data.success ? 'success' : 'error');

        if (data.success) {
          document.getElementById('title').value          = '';
          document.getElementById('message').value        = '';
          document.getElementById('start_datetime').value = '';
          document.getElementById('end_datetime').value   = '';
          loadAnnouncements();
        }
      } catch {
        showToast('Failed to add announcement', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function approve(id) {
      try {
        const res  = await fetch(`${API}/announcements/approve/${id}`, { method: 'POST' });
        const data = await res.json();
        showToast(data.success ? 'Announcement approved and sent to display' : (data.message || 'Approval failed'), data.success ? 'success' : 'error');
        loadAnnouncements();
      } catch {
        showToast('Failed to approve', 'error');
      }
    }

    function del(id) {
      showConfirm('This announcement will be permanently deleted.', async () => {
        try {
          const res  = await fetch(`${API}/announcements/${id}`, { method: 'DELETE' });
          const data = await res.json();
          showToast(data.success ? 'Announcement deleted' : (data.message || 'Delete failed'), data.success ? 'success' : 'error');
          loadAnnouncements();
        } catch {
          showToast('Failed to delete', 'error');
        }
      }, 'Delete Announcement');
    }

    function fmt(dt) {
      if (!dt) return '—';
      return new Date(dt).toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' });
    }
  </script>

</body>
</html>
