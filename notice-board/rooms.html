<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notice Board - Rooms</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sidebar">
    <h2>📋 Notice Board</h2>
    <a href="index.html">🏠 Dashboard</a>
    <a href="announcements.html">📢 Announcements</a>
    <a href="timetable.html">📅 Timetable</a>
    <a href="sessions.html">🎓 Sessions</a>
    <a href="sections.html">👥 Sections</a>
    <a href="subjects.html">📚 Subjects</a>
    <a href="rooms.html" class="active">🏫 Rooms</a>
    <a href="teachers.html">👨‍🏫 Teachers</a>
    <a href="offices.html">🏢 Teacher Offices</a>
  </div>

  <div class="main">
    <h1>Rooms</h1>
    <p class="subtitle">Manage department rooms</p>

    <div class="card">
      <h2>➕ Add New Room</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Room Number</label>
          <input type="text" id="room_number" placeholder="e.g. N13, Lab5" />
        </div>
      </div>
      <button class="btn btn-primary" onclick="addRoom()">➕ Add Room</button>
    </div>

    <div class="card">
      <h2>🏫 All Rooms</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Room Number</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="rooms-list">
          <tr><td colspan="3">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    window.onload = loadRooms;

    async function loadRooms() {
      const data  = await fetch('http://localhost:3000/rooms').then(r => r.json());
      const tbody = document.getElementById('rooms-list');
      tbody.innerHTML = '';

      data.forEach((r, i) => {
        tbody.innerHTML += `
          <tr>
            <td>${i + 1}</td>
            <td><strong>${r.room_number}</strong></td>
            <td>
              <button class="btn btn-danger" onclick="deleteRoom(${r.room_id})">🗑️ Delete</button>
            </td>
          </tr>
        `;
      });
    }

    async function addRoom() {
      const room_number = document.getElementById('room_number').value;

      if (!room_number) {
        alert('Please enter room number!');
        return;
      }

      const res    = await fetch('http://localhost:3000/rooms', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ room_number })
      });
      const result = await res.json();
      alert(result.message);
      document.getElementById('room_number').value = '';
      loadRooms();
    }

    async function deleteRoom(id) {
      if (!confirm('Delete this room?')) return;
      const res    = await fetch(`http://localhost:3000/rooms/${id}`, { method: 'DELETE' });
      const result = await res.json();
      alert(result.message);
      loadRooms();
    }
  </script>

</body>
</html>
