<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <head>
  <link rel="icon" type="image/png" href="uet_cs_logo.jpg">
  <title>Sessions — UET CS Notice Board</title>
  </head>
  <meta name="description" content="Manage semester sessions for the UET CS Department.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Sessions</h1>
        <p class="subtitle">Manage semester sessions — each Year + Term + Semester combination must be unique</p>
      </div>
    </div>

    <!-- Add Form -->
    <div class="card">
      <div class="card-header">
        <h2><i data-lucide="plus-circle"></i> Add New Session</h2>
      </div>
      <div class="form-grid cols-4">
        <div class="form-group">
          <label for="session_name">Session Name</label>
          <input type="text" id="session_name" placeholder="e.g. 25 Fall Morning">
        </div>
        <div class="form-group">
          <label for="year">Year</label>
          <input type="number" id="year" placeholder="e.g. 2025" min="2000" max="2100">
        </div>
        <div class="form-group">
          <label for="term">Term</label>
          <select id="term">
            <option value="Fall">Fall</option>
            <option value="Spring">Spring</option>
          </select>
        </div>
        <div class="form-group">
          <label for="semester">Semester</label>
          <input type="number" id="semester" placeholder="e.g. 4" min="1" max="8">
        </div>
      </div>
      <button class="btn btn-primary" id="add-btn" onclick="addSession()">
        <i data-lucide="plus"></i> Add Session
      </button>
    </div>

    <!-- Sessions Table -->
    <div class="card">
      <div class="card-header">
        <h2><i data-lucide="graduation-cap"></i> All Sessions</h2>
        <span id="sess-count" class="badge badge-gray">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Session Name</th>
              <th>Year</th>
              <th>Term</th>
              <th>Semester</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="sessions-list">
            <tr><td colspan="6" class="empty-row">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    checkAuth('admin');
    renderSidebar('sessions.html');

    const API = 'http://localhost:3000';

    window.onload = loadSessions;

    async function loadSessions() {
      try {
        const data  = await fetch(`${API}/sessions`).then(r => r.json());
        const tbody = document.getElementById('sessions-list');
        document.getElementById('sess-count').textContent = `${data.length} sessions`;
        tbody.innerHTML = '';

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty-row">No sessions added yet</td></tr>';
          return;
        }

        data.forEach((s, i) => {
          tbody.innerHTML += `
            <tr>
              <td class="text-muted text-sm">${i + 1}</td>
              <td><span class="font-semibold">${s.session_name}</span></td>
              <td class="text-secondary">${s.year}</td>
              <td><span class="badge badge-blue">${s.term}</span></td>
              <td class="text-secondary">Semester ${s.semester}</td>
              <td>
                <button class="btn btn-danger" onclick="delSession(${s.session_id})">
                  <i data-lucide="trash-2"></i> Delete
                </button>
              </td>
            </tr>`;
        });
        if (window.lucide) lucide.createIcons();
      } catch {
        showToast('Could not load sessions', 'error');
      }
    }

    async function addSession() {
      const year         = document.getElementById('year').value.trim();
      const term         = document.getElementById('term').value;
      const semester     = document.getElementById('semester').value;
      const session_name = document.getElementById('session_name').value.trim();

      if (!session_name || !year || !semester) {
        showToast('Please fill in all required fields', 'warning');
        return;
      }

      if (semester < 1 || semester > 8) {
        showToast('Semester must be between 1 and 8', 'warning');
        return;
      }

      const btn = document.getElementById('add-btn');
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/sessions`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ session_name, year, term, semester })
        });
        const result = await res.json();

        showToast(result.success ? 'Session added successfully' : (result.message || 'Failed to add session'), result.success ? 'success' : 'error');

        if (result.success) {
          document.getElementById('session_name').value = '';
          document.getElementById('year').value = '';
          document.getElementById('semester').value = '';
          loadSessions();
        }
      } catch {
        showToast('Failed to add session', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function delSession(id) {
      showConfirm('This will also delete all related sections and timetable entries.', async () => {
        try {
          const res    = await fetch(`${API}/sessions/${id}`, { method: 'DELETE' });
          const result = await res.json();
          showToast(result.success ? 'Session deleted' : (result.message || 'Delete failed'), result.success ? 'success' : 'error');
          loadSessions();
        } catch {
          showToast('Failed to delete session', 'error');
        }
      }, 'Delete Session');
    }
  </script>

</body>
</html>
