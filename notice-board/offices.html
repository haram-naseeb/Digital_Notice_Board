<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <head>
  <link rel="icon" type="image/png" href="uet_cs_logo.jpg">
    <title>Teacher Offices — UET CS Notice Board</title>
  </head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>

  <!-- ── Sidebar Container ──────────────────────────────── -->
  <div id="sidebar-container"></div>

  <main class="main">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Teacher Offices</h1>
        <p class="subtitle">Assign teachers to office rooms and cabins</p>
      </div>
    </div>

    <!-- Ground Floor -->
    <div class="card">
      <div class="card-header">
        <h2><i data-lucide="building-2"></i> Ground Floor</h2>
        <span id="gf-count" class="badge badge-gray">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Teacher</th>
              <th>Room</th>
              <th>Cabin</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ground-floor-list">
            <tr><td colspan="5" class="empty-row">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 1st Floor -->
    <div class="card">
      <div class="card-header">
        <h2><i data-lucide="building-2"></i> 1st Floor</h2>
        <span id="ff-count" class="badge badge-gray">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Teacher</th>
              <th>Room</th>
              <th>Cabin</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="first-floor-list">
            <tr><td colspan="5" class="empty-row">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Edit Modal — only teacher is editable; room & cabin are read-only -->
  <div id="edit-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Assign Teacher">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Assign Teacher to Office</h3>
        <button class="modal-close" onclick="closeModal()" aria-label="Close">
          <i data-lucide="x"></i>
        </button>
      </div>
      <input type="hidden" id="edit-id" />
      <div class="form-grid">
        <div class="form-group">
          <label for="edit-teacher_id">Teacher</label>
          <select id="edit-teacher_id">
            <option value="">Select a teacher</option>
          </select>
        </div>
        <div class="form-group">
          <label for="edit-floor">Floor</label>
          <!-- Read-only: displayed as plain text, value held in hidden input -->
          <input type="text" id="edit-floor-display" disabled style="background:var(--bg-muted,#f3f4f6);color:var(--text-muted,#6b7280);cursor:not-allowed;" />
          <input type="hidden" id="edit-floor" />
        </div>
        <div class="form-group">
          <label for="edit-room">Room Number</label>
          <input type="text" id="edit-room" disabled
            style="background:var(--bg-muted,#f3f4f6);color:var(--text-muted,#6b7280);cursor:not-allowed;" />
        </div>
        <div class="form-group">
          <label for="edit-cabin">Cabin Number</label>
          <input type="text" id="edit-cabin" disabled
            style="background:var(--bg-muted,#f3f4f6);color:var(--text-muted,#6b7280);cursor:not-allowed;" />
        </div>
      </div>
      <p style="font-size:0.78rem;color:var(--text-muted,#6b7280);margin-top:-4px;">
        <i data-lucide="info" style="width:13px;height:13px;vertical-align:-2px;"></i>
        Room and cabin are fixed office structures and cannot be changed here.
      </p>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEdit()">
          <i data-lucide="save"></i> Save Assignment
        </button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    // Auth guard - admin only
    checkAuth('admin');
    renderSidebar('offices.html');

    const API = window.API_BASE;

    window.onload = async () => {
      await loadTeachers();
      await loadOffices();
    };

    // Close modal on overlay click
    document.getElementById('edit-modal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    async function loadTeachers() {
      try {
        const res      = await fetch(`${API}/teachers`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const teachers = await res.json();
        if (!Array.isArray(teachers)) return;

        const sel = document.getElementById('edit-teacher_id');
        teachers.forEach(t => {
          sel.innerHTML += `<option value="${t.teacher_id}">${t.teacher_name}</option>`;
        });
      } catch (err) { showToast('Could not load teachers: ' + err.message, 'error'); }
    }

    async function loadOffices() {
      try {
        const data = await fetch(`${API}/offices`).then(r => r.json());
        const gf   = data.filter(o => o.floor === 'Ground Floor');
        const ff   = data.filter(o => o.floor === '1st Floor');

        document.getElementById('gf-count').textContent = `${gf.length} offices`;
        document.getElementById('ff-count').textContent = `${ff.length} offices`;

        renderFloor('ground-floor-list', gf);
        renderFloor('first-floor-list', ff);
      } catch { showToast('Could not load offices', 'error'); }
    }

    function renderFloor(tbodyId, data) {
      const tbody = document.getElementById(tbodyId);
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-row">No offices on this floor</td></tr>';
        return;
      }

      // Group by room number to visually cluster teachers sharing a room
      const byRoom = {};
      data.forEach(o => {
        if (!byRoom[o.room_number]) byRoom[o.room_number] = [];
        byRoom[o.room_number].push(o);
      });

      let globalIndex = 1;
      Object.entries(byRoom).forEach(([room, entries]) => {
        entries.forEach((o, idx) => {
          const isFirstInRoom = idx === 0;
          const rowspan       = entries.length;

          tbody.innerHTML += `
            <tr>
              <td class="text-muted text-sm">${globalIndex++}</td>
              <td><span class="font-medium">${o.teacher_name}</span></td>
              ${isFirstInRoom
                ? `<td rowspan="${rowspan}" style="vertical-align:middle;border-left:3px solid var(--color-primary,#6366f1);">${o.room_number}</td>`
                : ''}
              <td>${o.cabin_number}</td>
              <td>
                <div class="td-actions">
                  <button class="btn btn-success" onclick="openEdit(${o.office_id}, ${o.teacher_id}, '${o.floor}', '${o.room_number}', '${o.cabin_number}')">
                    <i data-lucide="pencil"></i> Edit
                  </button>
                </div>
              </td>
            </tr>`;
        });
      });

      if (window.lucide) lucide.createIcons();
    }

    function openEdit(id, teacherId, floor, room, cabin) {
      document.getElementById('edit-id').value            = id;
      document.getElementById('edit-teacher_id').value    = teacherId;
      document.getElementById('edit-floor').value         = floor;
      document.getElementById('edit-floor-display').value = floor;
      document.getElementById('edit-room').value          = room;
      document.getElementById('edit-cabin').value         = cabin;

      const modal = document.getElementById('edit-modal');
      modal.classList.add('open');
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('edit-modal').classList.remove('open');
    }

    async function saveEdit() {
      const id   = document.getElementById('edit-id').value;
      const teacherId = parseInt(document.getElementById('edit-teacher_id').value);

      if (!teacherId) {
        showToast('Please select a teacher', 'warning');
        return;
      }

      // Only send teacher_id — room, cabin, and floor stay untouched on the backend
      const data = {
        teacher_id:   teacherId,
        floor:        document.getElementById('edit-floor').value,
        room_number:  document.getElementById('edit-room').value,
        cabin_number: document.getElementById('edit-cabin').value,
      };

      try {
        const res    = await fetch(`${API}/offices/${id}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
        });
        const result = await res.json();
        showToast(result.message || 'Teacher assigned successfully', res.ok ? 'success' : 'error');
        if (res.ok) {
          closeModal();
          loadOffices();
        }
      } catch { showToast('Failed to save assignment', 'error'); }
    }
  </script>

</body>
</html>
