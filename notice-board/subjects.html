<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <head>
  <link rel="icon" type="image/png" href="uet_cs_logo.jpg">
  <title>Subjects — UET CS Notice Board</title>
  </head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>

  <!-- ── Sidebar Container ──────────────────────────────── -->
  <div id="sidebar-container"></div>

  <main class="main">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Subjects</h1>
        <p class="subtitle">Manage department course subjects and codes</p>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2><i data-lucide="plus-circle"></i> Add New Subject</h2>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label for="subject_name">Subject Name</label>
          <input type="text" id="subject_name" placeholder="e.g. Computer Networks" />
        </div>
        <div class="form-group">
          <label for="subject_code">Subject Code</label>
          <input type="text" id="subject_code" placeholder="e.g. CN-401" />
        </div>
      </div>
      <button class="btn btn-primary" onclick="addSubject()">
        <i data-lucide="plus"></i> Add Subject
      </button>
    </div>

    <div class="card">
      <div class="card-header">
        <h2><i data-lucide="book-open"></i> All Subjects</h2>
        <span id="subj-count" class="badge badge-gray">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Subject Name</th>
              <th>Code</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="subjects-list">
            <tr><td colspan="4" class="empty-row">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    // Auth guard - admin only
    checkAuth('admin');
    renderSidebar('subjects.html');

    const API = 'http://localhost:3000';

    window.onload = loadSubjects;

    async function loadSubjects() {
      try {
        const data  = await fetch(`${API}/subjects`).then(r => r.json());
        const tbody = document.getElementById('subjects-list');
        document.getElementById('subj-count').textContent = `${data.length} subjects`;
        tbody.innerHTML = '';

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="empty-row">No subjects yet</td></tr>';
          return;
        }

        data.forEach((s, i) => {
          tbody.innerHTML += `
            <tr>
              <td class="text-muted text-sm">${i + 1}</td>
              <td><span class="font-medium">${s.subject_name}</span></td>
              <td><span class="badge badge-blue">${s.subject_code}</span></td>
              <td>
                <button class="btn btn-danger" onclick="delSubject(${s.subject_id})">
                  <i data-lucide="trash-2"></i> Delete
                </button>
              </td>
            </tr>`;
        });
        if (window.lucide) lucide.createIcons();
      } catch { showToast('Could not load subjects', 'error'); }
    }

    async function addSubject() {
      const data = {
        subject_name: document.getElementById('subject_name').value.trim(),
        subject_code: document.getElementById('subject_code').value.trim(),
      };
      if (!data.subject_name || !data.subject_code) {
        showToast('Please fill in all fields', 'warning'); return;
      }
      try {
        const res    = await fetch(`${API}/subjects`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
        });
        const result = await res.json();
        showToast(result.message || 'Subject added', res.ok ? 'success' : 'error');
        if (res.ok) {
          document.getElementById('subject_name').value = '';
          document.getElementById('subject_code').value = '';
          loadSubjects();
        }
      } catch { showToast('Failed to add subject', 'error'); }
    }

    function delSubject(id) {
      showConfirm('This subject will be permanently removed.', async () => {
        try {
          const res    = await fetch(`${API}/subjects/${id}`, { method: 'DELETE' });
          const result = await res.json();
          showToast(result.message || 'Deleted', res.ok ? 'success' : 'error');
          loadSubjects();
        } catch { showToast('Failed to delete subject', 'error'); }
      }, 'Delete Subject');
    }
  </script>

</body>
</html>
