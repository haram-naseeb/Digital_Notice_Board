<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <head>
  <link rel="icon" type="image/png" href="uet_cs_logo.jpg">
  <title>Sections — UET CS Notice Board</title>
  </head>
  <meta name="description" content="Manage class sections per session for the UET CS Department.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Sections</h1>
        <p class="subtitle">Manage class sections per session — same section name cannot repeat in the same session</p>
      </div>
    </div>

    <!-- Add Form -->
    <div class="card">
      <div class="card-header">
        <h2><i data-lucide="plus-circle"></i> Add New Section</h2>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label for="session_id">Session</label>
          <select id="session_id"><option value="">Select a session...</option></select>
        </div>
        <div class="form-group">
          <label for="section_name">Section Name</label>
          <input type="text" id="section_name" placeholder="e.g. A, B, C">
        </div>
      </div>
      <button class="btn btn-primary" id="add-btn" onclick="addSection()">
        <i data-lucide="plus"></i> Add Section
      </button>
    </div>

    <!-- Sections Table -->
    <div class="card">
      <div class="card-header">
        <h2><i data-lucide="users"></i> All Sections</h2>
        <span id="sec-count" class="badge badge-gray">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Session</th>
              <th>Section</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="sections-list">
            <tr><td colspan="4" class="empty-row">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    checkAuth('admin');
    renderSidebar('sections.html');

    const API = window.API_BASE;

    window.onload = async () => {
      await loadSessionDropdown();
      await loadSections();
    };

    async function loadSessionDropdown() {
      try {
        const sessions = await fetch(`${API}/sessions`).then(r => r.json());
        const sel = document.getElementById('session_id');
        sel.innerHTML = '<option value="">Select a session...</option>';
        sessions.forEach(s => {
          sel.innerHTML += `<option value="${s.session_id}">${s.session_name}</option>`;
        });
      } catch {
        showToast('Could not load sessions', 'error');
      }
    }

    async function loadSections() {
      try {
        const data  = await fetch(`${API}/sections`).then(r => r.json());
        const tbody = document.getElementById('sections-list');
        document.getElementById('sec-count').textContent = `${data.length} sections`;
        tbody.innerHTML = '';

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="empty-row">No sections added yet</td></tr>';
          return;
        }

        data.forEach((s, i) => {
          tbody.innerHTML += `
            <tr>
              <td class="text-muted text-sm">${i + 1}</td>
              <td class="text-secondary">${s.session_name}</td>
              <td><span class="font-semibold">${s.section_name}</span></td>
              <td>
                <button class="btn btn-danger" onclick="delSection(${s.section_id})">
                  <i data-lucide="trash-2"></i> Delete
                </button>
              </td>
            </tr>`;
        });
        if (window.lucide) lucide.createIcons();
      } catch {
        showToast('Could not load sections', 'error');
      }
    }

    async function addSection() {
      const session_id   = document.getElementById('session_id').value;
      const section_name = document.getElementById('section_name').value.trim().toUpperCase();

      if (!session_id) {
        showToast('Please select a session', 'warning');
        return;
      }
      if (!section_name) {
        showToast('Please enter a section name', 'warning');
        return;
      }

      const btn = document.getElementById('add-btn');
      btn.disabled = true;

      try {
        const res    = await fetch(`${API}/sections`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ session_id, section_name })
        });
        const result = await res.json();
        showToast(result.success ? 'Section added successfully' : (result.message || 'Failed to add section'), result.success ? 'success' : 'error');
        if (result.success) {
          document.getElementById('section_name').value = '';
          loadSections();
        }
      } catch {
        showToast('Failed to add section', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function delSection(id) {
      showConfirm('This section and all its timetable entries will be permanently removed.', async () => {
        try {
          const res    = await fetch(`${API}/sections/${id}`, { method: 'DELETE' });
          const result = await res.json();
          showToast(result.success ? 'Section deleted' : (result.message || 'Delete failed'), result.success ? 'success' : 'error');
          loadSections();
        } catch {
          showToast('Failed to delete section', 'error');
        }
      }, 'Delete Section');
    }
  </script>

</body>
</html>
